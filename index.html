<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Smart-Ernaehrungsberater</title>

    <script src="script.js"></script>

    <!--
    multiple accept=".csv, .json, .xml"

    -->

</head>
<body>
    <div>
        <h1>DUMMY</h1>
    </div>

    <div>
        <div>
            <form id="dropzone" class="form">
                <p class="dropper">Datei hier hinein ziehen oder auswählen.</p>
                <input type="file" id="fileElem" accept=".csv, .json, .xml" onchange="saveData(this.files)">
            </form>
            <button id="send">send</button>
        </div>

        <div id="preview"></div>
    </div>
</body>
</html>
